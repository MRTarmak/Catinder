name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run unit tests
        run: flutter test test/auth_validator_test.dart test/auth_repository_test.dart

      - name: Run widget tests
        run: flutter test test/auth_widget_test.dart
